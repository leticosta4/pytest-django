name: main-regsmart

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTEST_ADDOPTS: "--color=yes"
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@b8659eeb6d6281353b348199a92dcad749d12136"

# Set permissions at the job level.
permissions: {}

jobs:
  test-regsmart:
    name: regsmart (${{ matrix.mode }}) ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.allow_failure }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TOXENV: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv tool install tox==4.28.4 --with tox-uv

      - name: Restore pytest-regsmart cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
          key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}
          restore-keys: |
            pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-


      - name: Run tox (regsmart)
        run: |
          tox run \
            -x "testenv.deps+=$REGSMART_PACKAGE" \
            -x "testenv.deps+=pytest-reportlog" \
            -- --regsmart --ranking-weight=${{ matrix.weight }} \
              --report-log="$GITHUB_WORKSPACE/reportlog.jsonl"

      - name: Save pytest-regsmart cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranked_selection_data
          key: pytest-regsmart-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-${{ github.run_id }}

      - name: Upload report-log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportlog-${{ matrix.mode }}
          path: reportlog.jsonl
          retention-days: 14


    strategy:
      fail-fast: false
      matrix:
        name: [py313-dj61-sqlite-coverage]
        python: ['3.13']
        allow_failure: [false]
        mode: [rgsm_qtf, rgsm_recentfail, rgsm_hybrid]
        include:
          - mode: rgsm_qtf
            weight: "1-0"
          - mode: rgsm_recentfail
            weight: "0-1"
          - mode: rgsm_hybrid
            weight: "1-1"

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
    - test-regsmart

    runs-on: ubuntu-24.04

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@2765efec08f0fd63e83ad900f5fd75646be69ff6
      with:
        jobs: ${{ toJSON(needs) }}

name: main-ranking

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTEST_ADDOPTS: "--color=yes"
  RANKING_PACKAGE: "pytest-ranking"

# Set permissions at the job level.
permissions: {}

jobs:
  test-ranking:
    name: ranking (${{ matrix.mode }}) ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.allow_failure }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TOXENV: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv tool install tox==4.28.4 --with tox-uv

      - name: Restore pytest-ranking cache
        id: restore-pytest-ranking-cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
          key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}


      - name: Run tox (regsmart)
        run: |
          tox run \
            -x "testenv.deps+=$RANKING_PACKAGE" \
            -- --rank --rank-weight=${{ matrix.weight }}

      - name: Save pytest-ranking cache
        id: save-pytest-ranking-cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pytest_cache/v/pytest_ranking_data
          key: pytest-ranking-cache-${{ github.workflow }}-${{ runner.os }}-${{ matrix.mode }}-${{ github.run_id }}


    strategy:
      fail-fast: false
      matrix:
        name: [py313-dj61-sqlite-coverage]
        python: ['3.13']
        allow_failure: [false]
        mode: [rkn_qtf, rkn_recentfail, rkn_simchgpath, rkn_hybrid]
        include:
          - mode: rkn_qtf
            weight: "1-0-0"
          - mode: rkn_recentfail
            weight: "0-1-0"
          - mode: rkn_simchgpath
            weight: "0-0-1"
          - mode: rkn_hybrid
            weight: "1-1-1"

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
    - test-ranking

    runs-on: ubuntu-24.04

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@2765efec08f0fd63e83ad900f5fd75646be69ff6
      with:
        jobs: ${{ toJSON(needs) }}
